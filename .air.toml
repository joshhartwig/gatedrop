# .air.toml
root = "."
tmp_dir = "tmp"

[build]
  cmd = "swag init -g ./cmd/api/main.go && go build -o ./tmp/main ./cmd/api"
  bin = "tmp/main"
  full_bin = "tmp/main"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor","docs"]
  exclude_file = []
  follow_symlink = true
  log = "build-errors.log"
  delay = 1000

[run]
cmd = ""